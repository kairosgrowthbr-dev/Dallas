<style>
/* Layout: cabeçalho de vidro, abertura com saudação + radar 3D das empresas, nichos em pílulas, quadro com uma coluna por nicho, assistente acoplada à direita. */
:root {
  --bg: #eef1f6; --bg-glow-1: rgba(214, 170, 80, .22); --bg-glow-2: rgba(20, 160, 136, .16);
  --surface: #ffffff; --surface-2: #f5f7fb; --surface-3: #e7ebf3; --glass: rgba(255, 255, 255, .72);
  --line: rgba(22, 32, 64, .09); --line-2: rgba(22, 32, 64, .16);
  --fg: #141a2b; --fg-2: #47506a; --fg-3: #6b748f;
  --gold: #9b6c16; --gold-fill-1: #f0cf7e; --gold-fill-2: #d2a043; --gold-ink: #2a1c04; --gold-soft: rgba(196, 146, 52, .14);
  --teal: #0e8a76; --teal-soft: rgba(14, 138, 118, .12);
  --wa: #1ba557; --wa-ink: #ffffff; --wa-soft: rgba(27, 165, 87, .12);
  --danger: #c2413a; --info: #2563b8; --coral: #d4582c; --coral-soft: rgba(212, 88, 44, .12);
  --shadow-1: 0 1px 2px rgba(22, 32, 64, .06), 0 4px 14px rgba(22, 32, 64, .06);
  --shadow-2: 0 18px 50px rgba(22, 32, 64, .16);
  --overlay: rgba(18, 24, 40, .38);
  --nl: 40%; --ns: 72%; --nsoft: 94%; --ns2: 80%;
  --radar-disc-1: rgba(14, 138, 118, .10); --radar-disc-2: rgba(14, 138, 118, .02); --radar-line: rgba(22, 32, 64, .14); --radar-sweep: 196, 146, 52;
  --orb-1: #fff1c9; --orb-2: #d9a74a; --orb-3: #0e8a76; --orb-glow: rgba(214, 167, 74, .45); --orb-ring: rgba(155, 108, 22, .55); --orb-ring2: rgba(14, 138, 118, .5);
  --sans: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --brand: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --r: 16px; --chat-w: 420px; --spring: cubic-bezier(.2, .9, .25, 1.15); --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1628; --bg-glow-1: rgba(214, 170, 80, .14); --bg-glow-2: rgba(40, 200, 170, .12);
    --surface: #172038; --surface-2: #1c2743; --surface-3: #263354; --glass: rgba(20, 29, 52, .74);
    --line: rgba(170, 190, 240, .12); --line-2: rgba(170, 190, 240, .22);
    --fg: #ecf0fa; --fg-2: #b6c0d9; --fg-3: #8a95b3;
    --gold: #ecc777; --gold-fill-1: #f3d48a; --gold-fill-2: #d7a54a; --gold-ink: #241803; --gold-soft: rgba(236, 199, 119, .14);
    --teal: #45d4b8; --teal-soft: rgba(69, 212, 184, .13);
    --wa: #29c86b; --wa-ink: #04170b; --wa-soft: rgba(41, 200, 107, .14);
    --danger: #f08a82; --info: #8ab8f5; --coral: #f59a72; --coral-soft: rgba(245, 154, 114, .14);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .25), 0 6px 18px rgba(0, 0, 0, .18);
    --shadow-2: 0 22px 60px rgba(0, 0, 0, .45);
    --overlay: rgba(4, 8, 18, .6);
    --nl: 72%; --ns: 70%; --nsoft: 22%; --ns2: 40%;
    --radar-disc-1: rgba(69, 212, 184, .12); --radar-disc-2: rgba(69, 212, 184, .02); --radar-line: rgba(170, 190, 240, .18); --radar-sweep: 236, 199, 119;
    --orb-glow: rgba(236, 199, 119, .4); --orb-ring: rgba(236, 199, 119, .6); --orb-ring2: rgba(69, 212, 184, .55); --orb-3: #18a88f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1628; --bg-glow-1: rgba(214, 170, 80, .14); --bg-glow-2: rgba(40, 200, 170, .12);
  --surface: #172038; --surface-2: #1c2743; --surface-3: #263354; --glass: rgba(20, 29, 52, .74);
  --line: rgba(170, 190, 240, .12); --line-2: rgba(170, 190, 240, .22);
  --fg: #ecf0fa; --fg-2: #b6c0d9; --fg-3: #8a95b3;
  --gold: #ecc777; --gold-fill-1: #f3d48a; --gold-fill-2: #d7a54a; --gold-ink: #241803; --gold-soft: rgba(236, 199, 119, .14);
  --teal: #45d4b8; --teal-soft: rgba(69, 212, 184, .13);
  --wa: #29c86b; --wa-ink: #04170b; --wa-soft: rgba(41, 200, 107, .14);
  --danger: #f08a82; --info: #8ab8f5; --coral: #f59a72; --coral-soft: rgba(245, 154, 114, .14);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .25), 0 6px 18px rgba(0, 0, 0, .18);
  --shadow-2: 0 22px 60px rgba(0, 0, 0, .45);
  --overlay: rgba(4, 8, 18, .6);
  --nl: 72%; --ns: 70%; --nsoft: 22%; --ns2: 40%;
  --radar-disc-1: rgba(69, 212, 184, .12); --radar-disc-2: rgba(69, 212, 184, .02); --radar-line: rgba(170, 190, 240, .18); --radar-sweep: 236, 199, 119;
  --orb-glow: rgba(236, 199, 119, .4); --orb-ring: rgba(236, 199, 119, .6); --orb-ring2: rgba(69, 212, 184, .55); --orb-3: #18a88f;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background-color .3s ease, color .3s ease; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ico { display: inline-flex; width: 1.15em; height: 1.15em; flex: none; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* fundo vivo */
.fundo { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.fundo i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(70px); opacity: .9; animation: deriva 26s ease-in-out infinite alternate; }
.fundo i:nth-child(1) { background: radial-gradient(circle, var(--bg-glow-1), transparent 65%); top: -22vmax; left: -12vmax; }
.fundo i:nth-child(2) { background: radial-gradient(circle, var(--bg-glow-2), transparent 65%); top: -10vmax; right: -18vmax; animation-duration: 32s; animation-delay: -8s; }
.fundo i:nth-child(3) { background: radial-gradient(circle, var(--bg-glow-2), transparent 65%); bottom: -30vmax; left: 30vw; animation-duration: 38s; opacity: .5; }
@keyframes deriva { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(6vmax, 4vmax, 0) scale(1.12); } }

.app { transition: margin-right .35s var(--ease); }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

/* cabeçalho */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap; padding-block: 10px; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.asa { width: 34px; height: 42px; position: relative; flex: none; display: grid; place-items: center; }
.asa img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(14, 138, 118, .25)); transition: transform .5s var(--spring); }
.marca:hover .asa img { transform: rotate(-8deg) scale(1.06); }
.marca b { font-family: var(--brand); font-weight: 700; letter-spacing: .28em; font-size: 19px; background: linear-gradient(100deg, var(--fg) 30%, var(--gold) 50%, var(--fg) 70%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: brilho 7s ease-in-out infinite; }
@keyframes brilho { 0%, 60% { background-position: 100% 0; } 100% { background-position: -50% 0; } }
.tabs { position: relative; display: flex; gap: 2px; background: var(--surface-3); border-radius: 12px; padding: 4px; }
.tab-ind { position: absolute; top: 4px; bottom: 4px; left: var(--x, 4px); width: var(--w, 0); background: var(--surface); border-radius: 9px; box-shadow: var(--shadow-1); transition: left .45s var(--spring), width .45s var(--spring); }
.tabs button { position: relative; z-index: 1; border: 0; background: none; padding: 7px 16px; border-radius: 9px; cursor: pointer; color: var(--fg-3); font-weight: 600; display: inline-flex; align-items: center; gap: 7px; transition: color .2s; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); }
.tabs button[aria-selected="true"] .ico { color: var(--teal); }
.grow { flex: 1 1 0; min-width: 0; }
.acts { display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); padding: 8px 14px; border-radius: 11px; cursor: pointer; font-weight: 600; text-decoration: none; white-space: nowrap; transition: transform .2s var(--spring), box-shadow .2s, background-color .2s, border-color .2s; }
.btn:hover { background: var(--surface-2); transform: translateY(-1px); box-shadow: var(--shadow-1); }
.btn:active { transform: translateY(0) scale(.98); }
.btn[disabled] { opacity: .5; cursor: default; transform: none; box-shadow: none; }
.btn.gold { border-color: transparent; background: linear-gradient(135deg, var(--gold-fill-1), var(--gold-fill-2)); color: var(--gold-ink); box-shadow: 0 6px 18px rgba(196, 146, 52, .3); position: relative; overflow: hidden; }
.btn.gold::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .55) 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s var(--ease); }
.btn.gold:hover::after { transform: translateX(120%); }
.btn.wa { border-color: transparent; background: var(--wa); color: var(--wa-ink); position: relative; }
.btn.wa:hover { box-shadow: 0 0 0 5px var(--wa-soft), var(--shadow-1); }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--fg); box-shadow: none; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 9px; gap: 6px; }
.btn.danger { color: var(--danger); }
.ib { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--fg-2); transition: transform .25s var(--spring), color .2s, background-color .2s; }
.ib:hover { color: var(--fg); transform: translateY(-1px) rotate(-6deg); }
.ib .ico { width: 18px; height: 18px; }
.ia-btn { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px 4px 5px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 700; }
.ia-btn:hover { box-shadow: 0 0 0 4px var(--gold-soft); }

/* abertura */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: center; padding-block: 26px 10px; }
.eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); }
.hero h1 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-top: 6px; text-wrap: balance; }
.hero h1 em { font-style: normal; background: linear-gradient(120deg, var(--gold), var(--teal)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .sub { color: var(--fg-2); margin-top: 8px; font-size: 15px; max-width: 60ch; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.kpi { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow-1); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: transform .3s var(--spring); }
.kpi:hover { transform: translateY(-3px); }
.kpi b { font-family: var(--mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi span { color: var(--fg-3); font-size: 12px; }
.kpi .ico { color: var(--k, var(--teal)); width: 18px; height: 18px; margin-bottom: 4px; }
.rot { color: var(--fg-3); font-size: 12.5px; margin-top: 12px; display: flex; align-items: center; gap: 6px; }
.rot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--wa); box-shadow: 0 0 0 0 var(--wa-soft); animation: ping 2.4s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(27, 165, 87, .45); } 70%, 100% { box-shadow: 0 0 0 8px rgba(27, 165, 87, 0); } }
.radar-box { position: relative; background: var(--glass); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-1); padding: 10px 12px 12px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); min-width: 0; }
#radar { display: block; width: 100%; height: 270px; cursor: crosshair; }
.radar-leg { color: var(--fg-3); font-size: 11.5px; text-align: center; }
.radar-tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 10px; box-shadow: var(--shadow-2); font-size: 12.5px; max-width: 240px; transform: translate(-50%, calc(-100% - 12px)); z-index: 2; }
.radar-tip b { display: block; font-size: 13px; }
.radar-tip span { color: var(--fg-3); }

/* nichos */
.nichos { display: flex; gap: 8px; overflow-x: auto; padding: 14px 2px 6px; scrollbar-width: thin; }
.pill { --h: 200; flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; color: var(--fg-2); transition: transform .25s var(--spring), border-color .2s, background-color .2s, color .2s; }
.pill:hover { transform: translateY(-2px); color: var(--fg); border-color: hsl(var(--h) var(--ns) var(--nl) / .5); }
.pill .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: hsl(var(--h) var(--ns2) var(--nsoft)); color: hsl(var(--h) var(--ns) var(--nl)); }
.pill .dot .ico { width: 15px; height: 15px; }
.pill i { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--fg-3); }
.pill[aria-pressed="true"] { background: hsl(var(--h) var(--ns2) var(--nsoft)); border-color: hsl(var(--h) var(--ns) var(--nl)); color: var(--fg); }
.pill.todos .dot { background: var(--surface-3); color: var(--fg-2); }

/* filtros */
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 8px 16px; align-items: center; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 8px 11px; min-width: 0; transition: border-color .2s, box-shadow .2s; }
.field:focus { border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); outline: none; }
.busca { position: relative; flex: 1 1 220px; max-width: 360px; }
.busca .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--fg-3); width: 16px; height: 16px; }
.busca input { width: 100%; padding-left: 34px; }
.notice { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 14px 16px; color: var(--fg-2); margin-bottom: 14px; background: var(--glass); }
.notice b { color: var(--fg); }

/* quadro */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 36px; align-items: start; scroll-snap-type: x proximity; }
.board.entra .col { animation: sobe .55s var(--ease) both; }
.board.entra .col:nth-child(2) { animation-delay: .04s; } .board.entra .col:nth-child(3) { animation-delay: .08s; } .board.entra .col:nth-child(4) { animation-delay: .12s; } .board.entra .col:nth-child(n+5) { animation-delay: .16s; }
@keyframes sobe { from { transform: translateY(14px); opacity: .4; } to { transform: none; opacity: 1; } }
.col { --h: 200; min-width: 0; scroll-snap-align: start; background: var(--glass); border: 1px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.col.over { border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
.col-h { padding: 12px 12px 10px; display: flex; gap: 10px; align-items: center; }
.col-h .tile { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: hsl(var(--h) var(--ns2) var(--nsoft)); color: hsl(var(--h) var(--ns) var(--nl)); flex: none; }
.col-h .tile .ico { width: 19px; height: 19px; }
.col-h h2 { font-size: 14px; font-weight: 700; line-height: 1.2; }
.col-h p { color: var(--fg-3); font-size: 12px; }
.col-h .n { margin-left: auto; font-family: var(--mono); font-size: 12px; background: var(--surface-3); color: var(--fg-2); padding: 2px 8px; border-radius: 999px; }
.col-b { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 10px; min-height: 80px; }
.vazio { color: var(--fg-3); font-size: 12.5px; padding: 10px 6px; }
.card { --rx: 0deg; --ry: 0deg; position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 9px; box-shadow: var(--shadow-1); transform: perspective(700px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .35s var(--ease), box-shadow .3s, border-color .3s; transform-style: preserve-3d; }
.card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 0%), rgba(255, 255, 255, .35), transparent 55%); opacity: 0; transition: opacity .3s; }
.card:hover { box-shadow: var(--shadow-2); border-color: hsl(var(--h) var(--ns) var(--nl) / .45); }
.card:hover::after { opacity: 1; }
.card.sel { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft), var(--shadow-1); }
.card-t { display: flex; gap: 10px; align-items: flex-start; }
.card-t h3 { font-size: 14px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.card-t .meta { margin-top: 2px; }
.anel { width: 40px; height: 40px; flex: none; position: relative; display: grid; place-items: center; }
.anel svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.anel circle { fill: none; stroke-width: 3.5; }
.anel .fundo-anel { stroke: var(--surface-3); }
.anel .valor { stroke: var(--pc, var(--teal)); stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease); }
.anel b { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.meta { color: var(--fg-3); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--fg-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.chip.p-max { border-color: transparent; background: var(--gold-soft); color: var(--gold); font-weight: 700; }
.chip.p-precisa { border-color: transparent; background: var(--coral-soft); color: var(--coral); font-weight: 700; }
.chip.p-compra { border-color: transparent; background: var(--teal-soft); color: var(--teal); font-weight: 700; }
.chip.p-aquecer { border-color: transparent; background: var(--surface-3); color: var(--fg-2); font-weight: 600; }
.chip.v { border-color: transparent; background: var(--wa-soft); color: var(--wa); }
.chip.novo { border-color: transparent; background: var(--wa); color: var(--wa-ink); font-weight: 700; }
.card-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-f .tel { font-family: var(--mono); font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.wa-r { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--wa); color: var(--wa-ink); text-decoration: none; position: relative; transition: transform .25s var(--spring); }
.wa-r .ico { width: 17px; height: 17px; }
.wa-r::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--wa); opacity: 0; }

/* ---------- Versão local (fora do claude.ai) ---------- */
function criarLocal() {
  const CH = 'radar.db.v1';
  let dados = null;
  try { dados = JSON.parse(localStorage.getItem(CH) || 'null'); } catch (e) { dados = null; }
  const novo = !dados; dados = dados || {};
  const ouvintes = new Set();
  const salvar = () => { try { localStorage.setItem(CH, JSON.stringify(dados)); } catch (e) { toast('O navegador não deixou salvar. Exporte um backup em Configurar.'); } };
  const avisar = () => ouvintes.forEach(f => { try { f(); } catch (e) {} });
  const meta = { fromCache: false, hasPendingWrites: false };
  const copia = d => JSON.parse(JSON.stringify(d));
  const snapDoc = path => { const d = dados[path]; return { id: path.split('/').pop(), exists: !!d, data: () => d ? copia(d) : undefined, metadata: meta }; };
  const snapCol = (path, lim) => { const pre = path + '/'; const docs = Object.keys(dados).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes('/')).sort().slice(0, lim).map(snapDoc); return { docs, size: docs.length, empty: !docs.length, metadata: meta, docChanges: () => [] }; };
  const ouvir = f => { ouvintes.add(f); setTimeout(f, 0); return () => ouvintes.delete(f); };
  const docRef = path => ({
    id: path.split('/').pop(), path,
    get: async () => snapDoc(path),
    set: async d => { dados[path] = copia(d); salvar(); avisar(); },
    update: async d => { if (!dados[path]) throw { code: 'invalid_argument', message: 'documento não existe' }; dados[path] = { ...dados[path], ...copia(d) }; salvar(); avisar(); },
    delete: async () => { delete dados[path]; salvar(); avisar(); },
    onSnapshot: next => ouvir(() => next(snapDoc(path))),
  });
  const colRef = (path, lim = 1000) => {
    const q = { path, limit: n => colRef(path, n), where: () => q, orderBy: () => q, get: async () => snapCol(path, lim),
      doc: id => docRef(path + '/' + (id || Date.now().toString(36) + Math.random().toString(36).slice(2, 8))),
      add: async d => { const r = q.doc(); await r.set(d); return r; },
      onSnapshot: next => ouvir(() => next(snapCol(path, lim))) };
    return q;
  };
  window.addEventListener('storage', e => { if (e.key === CH) { try { dados = JSON.parse(e.newValue || '{}') || {}; } catch (x) {} avisar(); } });
  // Junta as empresas do pacote (dados/leads.json) às do navegador. Cada empresa entra uma vez só:
  // a que você excluiu não volta, e a que você já mexeu não é sobrescrita.
  if (location.protocol !== 'file:') {
    fetch('dados/leads.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
      if (!j) return;
      let vistos; try { vistos = new Set(JSON.parse(localStorage.getItem('radar.semeados') || '[]')); } catch (e) { vistos = new Set(); }
      if (!novo && !vistos.size) {
        // navegador da versão anterior: conta como já recebido tudo o que veio até o último pacote aberto aqui
        let corte = '';
        for (const [k, d] of Object.entries(dados)) if (k.startsWith('leads/')) { vistos.add(k.slice(6)); if (/^garimpo/.test(d.origem || '') && String(d.criado_em || '') > corte) corte = String(d.criado_em); }
        for (const x of Array.isArray(j.leads) ? j.leads : []) if (x && typeof x.id === 'string' && corte && String(x.criado_em || '') <= corte) vistos.add(x.id);
      }
      let mudou = false;
      for (const x of Array.isArray(j.leads) ? j.leads : []) {
        if (!x || typeof x.id !== 'string' || vistos.has(x.id)) continue;
        const { id, ...d } = x; vistos.add(id);
        if (!dados['leads/' + id]) { dados['leads/' + id] = d; mudou = true; }
      }
      if (j.config && !dados['config/principal']) { dados['config/principal'] = j.config; mudou = true; }
      try { localStorage.setItem('radar.semeados', JSON.stringify([...vistos])); } catch (e) {}
      if (mudou) { salvar(); avisar(); }
    }).catch(() => {});
  }

  /* IA: chama a API do Claude direto do navegador, com o SDK oficial que vem na pasta vendor/ */
  let sdk = null;
  const carregarSdk = () => sdk || (sdk = import('./vendor/anthropic-sdk.mjs').then(m => m.Anthropic).catch(e => { sdk = null; throw e; }));
  async function erroApi(e, texto) {
    const A = await carregarSdk().catch(() => null);
    const extra = texto ? { text: texto } : {};
    if (e && (e.name === 'AbortError' || (A && e instanceof A.APIUserAbortError))) return { code: 'cancelled', ...extra };
    const st = e && e.status;
    const msg = String((e && e.error && e.error.error && e.error.error.message) || (e && e.message) || '');
    if (st === 401) return { code: 'chave_invalida', message: msg, ...extra };
    if (st === 429) return { code: 'rate_limited', message: msg, ...extra };
    if (/credit balance/i.test(msg)) return { code: 'sem_credito', message: msg, ...extra };
    if (st) return { code: 'api', message: msg.slice(0, 240), ...extra };
    return { code: 'upstream_error', message: msg, ...extra };
  }
  // Depois de uma troca de modelo no meio da resposta, o histórico devolve só o que a API aceita antes do bloco "fallback".
  function ecoSeguro(content) {
    const iFb = content.map(b => b.type).lastIndexOf('fallback');
    if (iFb < 0) return content;
    const pares = new Set(content.filter(b => /_tool_result$/.test(b.type) && b.type !== 'tool_result').map(b => b.tool_use_id));
    return content.filter((b, i) => i >= iFb || b.type === 'text' || (/_tool_result$/.test(b.type) && b.type !== 'tool_result') || (b.type === 'server_tool_use' && pares.has(b.id)));
  }
  async function sample(input, opts = {}) {
    const k = mem('radar.apikey');
    if (!k) throw { code: 'sem_chave', message: '' };
    let A;
    try { A = await carregarSdk(); } catch (e) { throw { code: 'api', message: 'não consegui carregar vendor/anthropic-sdk.mjs (abra pelo atalho do Radar)' }; }
    const cli = new A({ apiKey: k, dangerouslyAllowBrowser: true, maxRetries: 2 });
    const msgs = typeof input === 'string' ? [{ role: 'user', content: input }] : input.map(t => ({ role: t.role, content: t.content }));
    const ferr = (opts.tools || []).map(t => ({ name: t.name, description: t.description, input_schema: t.inputSchema || { type: 'object', properties: {} } }));
    const tools = [...(opts.serverTools || []), ...ferr];
    let texto = '', truncated = false;
    for (let volta = 0; volta < 12; volta++) {
      if (opts.signal && opts.signal.aborted) throw { code: 'cancelled', ...(texto ? { text: texto } : {}) };
      const params = { model: 'claude-opus-5-5', max_tokens: opts.maxTokens || 32000, messages: msgs, output_config: { effort: opts.effort || 'medium' },
        betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' };
      if (tools.length) params.tools = tools;
      let sep = texto ? '\n\n' : '';
      let msg;
      try {
        const stream = cli.beta.messages.stream(params, opts.signal ? { signal: opts.signal } : undefined);
        stream.on('text', d => { if (!d) return; texto += sep + d; sep = ''; if (opts.onText) { try { opts.onText({ text: texto, delta: d }); } catch (e) {} } });
        msg = await stream.finalMessage();
      } catch (e) { throw await erroApi(e, texto); }
      if (msg.stop_reason === 'refusal') throw { code: 'refused', message: '' };
      if (msg.stop_reason === 'max_tokens') truncated = true;
      if (msg.stop_reason === 'pause_turn') { msgs.push({ role: 'assistant', content: ecoSeguro(msg.content) }); continue; }
      const usos = msg.content.filter(b => b.type === 'tool_use');
      if (msg.stop_reason === 'tool_use' && usos.length) {
        msgs.push({ role: 'assistant', content: ecoSeguro(msg.content) });
        const sinal = opts.signal || new AbortController().signal;
        const res = await Promise.all(usos.map(async u => {
          const t = (opts.tools || []).find(x => x.name === u.name);
          try {
            if (!t) throw new Error('ferramenta desconhecida');
            const r = await t.execute(u.input || {}, { signal: sinal });
            return { type: 'tool_result', tool_use_id: u.id, content: typeof r === 'string' ? r : JSON.stringify(r ?? null) };
          } catch (e) { return { type: 'tool_result', tool_use_id: u.id, content: 'Error: ' + ((e && e.message) || String(e)), is_error: true }; }
        }));
        msgs.push({ role: 'user', content: res });
        continue;
      }
      break;
    }
    if (!texto.trim()) throw { code: 'empty_completion', message: '' };
    return { text: texto, truncated, modelTierApplied: 'default' };
  }
  sample.json = async (input, opts) => {
    const { text } = await sample(input, opts);
    const t = text.trim(), tentar = s => { try { return { ok: true, v: JSON.parse(s) }; } catch (e) { return { ok: false }; } };
    let r = tentar(t);
    if (!r.ok) { const m = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) r = tentar(m[1].trim()); }
    if (!r.ok) { const i = t.search(/[\[{]/), j = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}')); if (i >= 0 && j > i) r = tentar(t.slice(i, j + 1)); }
    if (!r.ok) throw { code: 'invalid_json', message: '', text };
    return r.v;
  };
  sample.limits = async () => ({ maxPromptBytes: 262144, tools: { maxCount: 16 } });

  const downloads = { save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/.test(filename) ? 'application/json' : 'text/csv;charset=utf-8' });
    const a = el('a', { href: URL.createObjectURL(blob), download: filename }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return { status: 'saved' };
  } };

  /* voz no navegador: leitura em voz alta e ditado (quando o navegador oferece) */
  const tts = ('speechSynthesis' in window) ? {
    speak: texto => new Promise((ok, falha) => {
      const u = new SpeechSynthesisUtterance(texto); u.lang = 'pt-BR'; u.rate = 1.05;
      const v = speechSynthesis.getVoices().find(x => /^pt[-_]BR/i.test(x.lang)); if (v) u.voice = v;
      u.onend = () => ok(); u.onerror = () => falha({ code: 'tts' });
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }),
    stop: () => speechSynthesis.cancel(),
  } : null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const dictation = SR ? (() => {
    let rec = null; const fP = [], fF = [], fS = [];
    return {
      start: () => {
        rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = true;
        rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; (e.results[i].isFinal ? fF : fP).forEach(f => f({ text: t })); } };
        rec.onend = () => fS.forEach(f => f({ state: 'idle', reason: 'stopped' }));
        rec.onerror = e => fS.forEach(f => f({ state: 'idle', reason: e.error || 'error' }));
        rec.start(); fS.forEach(f => f({ state: 'listening' }));
        return Promise.resolve();
      },
      stop: async () => { if (rec) rec.stop(); },
      onPartial: f => fP.push(f), onFinal: f => fF.push(f), onState: f => fS.push(f),
    };
  })() : null;
  return { db: { doc: docRef, collection: colRef }, sample, downloads, tts, dictation };
}

/* ---------- Início ---------- */
pintarIcones(document);
aplicarTema(mem('radar.tema') || 'light');
irPara(location.hash.slice(1));
radarIniciar();
renderChat();
if (mem('radar.chat') === '1' || (mem('radar.chat') == null && window.innerWidth >= 1400)) abrirChat();
const LOCAL = MODO_LOCAL ? criarLocal() : {};
const usar = n => MODO_LOCAL ? Promise.resolve(LOCAL[n] || null) : window.claude.use(n).catch(() => null);
usar('db').then(initDb);
usar('sample').then(async s => { S.sample = s; if (s) { const lim = await s.limits().catch(() => null); S.tools = !!(lim && lim.tools); } renderChat(); render(); });
usar('mcp').then(m => { S.mcp = m; });
usar('downloads').then(d => { S.dl = d; render(); });
Promise.all([usar('tts'), usar('dictation')]).then(([t, d]) => { S.tts = t; S.dict = d; ligarVoz(); renderChat(); });
})();
</script>
