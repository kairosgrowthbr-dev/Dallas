<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- Gerado por montar.mjs a partir de painel.html. Edite o painel.html e rode: node radar/montar.mjs -->
<meta name="claude:viewport-fit-sides" content="cover">
<title>Radar Dalas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra fixa no topo, quadro de colunas no centro, IA acoplada à direita, ficha do lead em gaveta. */
:root {
  --bg: #07070a; --surface: #101014; --surface-2: #17171d; --surface-3: #22222b;
  --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
  --fg: #ececf0; --fg-2: #b4b4bd; --fg-3: #8a8a94;
  --gold: #d6b46a; --gold-ink: #1a1408; --gold-soft: rgba(214,180,106,.13);
  --green: #3fbf6e; --green-ink: #04130a; --green-soft: rgba(63,191,110,.13);
  --danger: #e8776f; --info: #86b6e8;
  --overlay: rgba(0,0,0,.62); --shadow: 0 24px 70px rgba(0,0,0,.6);
  --sans: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --brand: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --r: 14px; --chat-w: 400px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f3ef; --surface: #ffffff; --surface-2: #f1f0eb; --surface-3: #e3e1da;
    --line: rgba(24,20,8,.10); --line-2: rgba(24,20,8,.20);
    --fg: #15151a; --fg-2: #46464e; --fg-3: #6a6a73;
    --gold: #8a6521; --gold-ink: #ffffff; --gold-soft: rgba(138,101,33,.12);
    --green: #1c7a40; --green-ink: #ffffff; --green-soft: rgba(28,122,64,.12);
    --danger: #b3392f; --info: #2c6aa3;
    --overlay: rgba(24,20,8,.38); --shadow: 0 24px 60px rgba(24,20,8,.18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f3ef; --surface: #ffffff; --surface-2: #f1f0eb; --surface-3: #e3e1da;
  --line: rgba(24,20,8,.10); --line-2: rgba(24,20,8,.20);
  --fg: #15151a; --fg-2: #46464e; --fg-3: #6a6a73;
  --gold: #8a6521; --gold-ink: #ffffff; --gold-soft: rgba(138,101,33,.12);
  --green: #1c7a40; --green-ink: #ffffff; --green-soft: rgba(28,122,64,.12);
  --danger: #b3392f; --info: #2c6aa3;
  --overlay: rgba(24,20,8,.38); --shadow: 0 24px 60px rgba(24,20,8,.18);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app { transition: margin-right .25s ease; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.sweep { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-2); position: relative; flex: none;
  background: radial-gradient(circle, transparent 0 34%, var(--line) 35% 37%, transparent 38% 66%, var(--line) 67% 69%, transparent 70%); overflow: hidden; }
.sweep::before { content: ""; position: absolute; inset: 0; background: conic-gradient(from 0deg, transparent 0 78%, var(--gold) 100%); opacity: .75; animation: giro 5s linear infinite; }
.sweep::after { content: ""; position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--green); top: 8px; left: 18px; }
@keyframes giro { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sweep::before { animation: none; } .app { transition: none; } }
.brand b { font-family: var(--brand); font-weight: 600; letter-spacing: .2em; font-size: 15px; }
.brand span { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--fg-3); text-transform: uppercase; }
.tabs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 6px 13px; border-radius: 7px; cursor: pointer; color: var(--fg-2); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--surface-3); color: var(--fg); }
.grow { flex: 1 1 0; min-width: 0; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); padding: 7px 13px; border-radius: 9px; cursor: pointer; font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.btn.green { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; border-radius: 7px; }
.btn.danger { color: var(--danger); }

/* Resumo */
.sum { display: flex; flex-wrap: wrap; gap: 6px 26px; padding-block: 14px 4px; align-items: baseline; }
.sum div { display: flex; align-items: baseline; gap: 7px; }
.sum strong { font-family: var(--mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.sum span { color: var(--fg-3); font-size: 12.5px; }
.sum .rot { margin-left: auto; color: var(--fg-3); font-size: 12.5px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 10px 14px; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; min-width: 0; }
.field:focus { border-color: var(--gold); outline: none; }
#f-busca { flex: 1 1 200px; max-width: 340px; }
.notice { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 14px 16px; color: var(--fg-2); margin-bottom: 14px; }
.notice b { color: var(--fg); }

/* Quadro */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(236px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 28px; align-items: start; scroll-snap-type: x proximity; }
.col { min-width: 0; scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; }
.col.over { border-color: var(--gold); }
.col-h { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.col-h h2 { font-size: 13.5px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.col-h h2 i { font-style: normal; font-family: var(--mono); font-weight: 400; color: var(--fg-3); font-size: 12px; }
.col-h p { color: var(--fg-3); font-size: 12px; margin-top: 2px; }
.col[data-col="max"] .col-h h2 { color: var(--gold); }
.col-b { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
.vazio { color: var(--fg-3); font-size: 12.5px; padding: 10px 6px; }
.card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.card:hover { border-color: var(--line-2); }
.card.sel { border-color: var(--gold); }
.card-t { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; }
.card-t h3 { font-size: 14px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.card-t .sc { font-family: var(--mono); font-size: 13px; color: var(--fg); background: var(--surface-3); border-radius: 6px; padding: 1px 6px; flex: none; }
.meta { color: var(--fg-3); font-size: 12.5px; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; color: var(--fg-3); }
.bar { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; }
.bar.n i { background: var(--gold); } .bar.p i { background: var(--green); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--fg-2); white-space: nowrap; }
.chip.g { border-color: transparent; background: var(--gold-soft); color: var(--gold); }
.chip.v { border-color: transparent; background: var(--green-soft); color: var(--green); }
.chip.novo { border-color: transparent; background: var(--green); color: var(--green-ink); font-weight: 600; }
.card-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-f .tel { font-family: var(--mono); font-size: 12px; color: var(--fg-2); white-space: nowrap; }

/* Lista */
.tbl-w { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-bottom: 28px; }
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); font-weight: 400; cursor: pointer; user-select: none; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.nome { white-space: normal; min-width: 200px; font-weight: 600; }

/* IA */
.chat { position: fixed; top: 0; right: 0; bottom: 0; width: var(--chat-w); max-width: 100%; z-index: 20; background: var(--surface); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.chat-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.chat-h h2 { font-size: 14px; font-weight: 700; } .chat-h p { font-size: 12px; color: var(--fg-3); }
.msgs { flex: 1 1 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; overflow-wrap: anywhere; }
.msg.u { align-self: flex-end; background: var(--gold-soft); border: 1px solid var(--line); }
.msg.a { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); }
.msg p + p, .msg ul, .msg ol { margin-top: 7px; } .msg ul, .msg ol { padding-left: 20px; margin-bottom: 0; }
.msg code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-3); padding: 0 4px; border-radius: 4px; }
.msg.err { color: var(--danger); background: none; border-style: dashed; }
.sug { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.sug button { border: 1px solid var(--line-2); background: none; border-radius: 99px; padding: 4px 10px; font-size: 12px; color: var(--fg-2); cursor: pointer; }
.sug button:hover { color: var(--fg); border-color: var(--gold); }
.chat-f { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; }
.chat-f textarea { flex: 1 1 0; min-width: 0; resize: none; max-height: 140px; }
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 8; box-shadow: var(--shadow); }
@media (min-width: 1180px) { body.chat-open .app { margin-right: var(--chat-w); } body.chat-open .fab { display: none; } }
@media (max-width: 1179px) { .chat { width: 100%; border-left: 0; padding-left: env(safe-area-inset-left, 0px); } }

/* Gaveta e modais */
.veil { position: fixed; inset: 0; background: var(--overlay); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 100%; z-index: 31; background: var(--surface); border-left: 1px solid var(--line-2); box-shadow: var(--shadow);
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dr-h { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.dr-h h2 { font-size: 18px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.dr-b { flex: 1 1 0; overflow-y: auto; padding: 16px 18px 22px; display: flex; flex-direction: column; gap: 18px; }
.dr-f { border-top: 1px solid var(--line); padding: 10px 18px; display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.sec h4 { margin: 0 0 7px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); font-weight: 400; }
.sec ul { margin: 0; padding-left: 18px; color: var(--fg-2); } .sec li + li { margin-top: 3px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gauge { background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
.gauge b { font-family: var(--mono); font-size: 22px; font-weight: 500; display: block; }
.gauge span { font-size: 12px; color: var(--fg-3); }
.gauge .bar { margin-top: 7px; height: 5px; }
.contact { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .k { width: 86px; flex: none; color: var(--fg-3); font-size: 12.5px; }
.row .v { font-family: var(--mono); user-select: all; overflow-wrap: anywhere; min-width: 0; }
.row a.v { color: var(--info); user-select: auto; }
textarea.field { width: 100%; resize: vertical; min-height: 84px; line-height: 1.45; }
.hint { color: var(--fg-3); font-size: 12px; }
.fontes a { color: var(--info); font-size: 12.5px; overflow-wrap: anywhere; }
.modal { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 480px; max-width: calc(100% - 32px); max-height: calc(100% - 48px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal h2 { font-size: 16px; } .veil.m { z-index: 40; }
.modal label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--fg-2); }
.modal .field { width: 100%; }
.pend { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--fg-2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--surface-3); border: 1px solid var(--line-2);
  border-radius: 11px; padding: 9px 12px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } .sum .rot { margin-left: 0; width: 100%; } .brand span { display: none; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="wrap top-in">
      <div class="brand"><div class="sweep" aria-hidden="true"></div><div><b>DALAS</b> <span>Radar de clientes</span></div></div>
      <nav class="tabs" role="tablist" aria-label="Visões">
        <button role="tab" data-view="radar" aria-selected="true">Radar</button>
        <button role="tab" data-view="funil" aria-selected="false">Funil</button>
        <button role="tab" data-view="lista" aria-selected="false">Lista</button>
      </nav>
      <div class="grow"></div>
      <div class="acts">
        <button class="btn gold" id="btn-garimpar">Garimpar empresas</button>
        <button class="btn" id="btn-novo">Novo lead</button>
        <button class="btn" id="btn-ia">Conversar com a IA</button>
        <button class="btn ghost" id="btn-cfg" aria-label="Configurações">Configurar</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section class="sum" id="sum" aria-label="Resumo"></section>
    <section class="filters" aria-label="Filtros">
      <select class="field" id="f-regiao" aria-label="Região"><option value="serra">Serra Gaúcha</option><option value="">Brasil inteiro</option></select>
      <input class="field" id="f-busca" type="search" placeholder="Buscar empresa, cidade ou nicho" aria-label="Buscar">
      <select class="field" id="f-uf" aria-label="Estado"></select>
      <select class="field" id="f-nicho" aria-label="Nicho"></select>
      <select class="field" id="f-tel" aria-label="Tipo de telefone">
        <option value="">Qualquer telefone</option><option value="celular">Só celular (WhatsApp)</option>
      </select>
      <button class="btn" id="btn-lote" hidden>Preparar abordagens com IA</button>
      <button class="btn" id="btn-csv" hidden>Baixar planilha</button>
    </section>
    <div id="aviso"></div>
    <main id="main"></main>
  </div>
</div>

<button class="btn gold fab" id="fab-ia">IA</button>

<aside class="chat" id="chat" hidden aria-label="Conversa com a IA">
  <div class="chat-h">
    <div class="grow"><h2>IA da Dalas</h2><p id="chat-sub">Conhece todos os leads do painel</p></div>
    <button class="btn ghost sm" id="chat-limpar">Limpar</button>
    <button class="btn ghost sm" id="chat-fechar" aria-label="Fechar conversa">Fechar</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="sug" id="sug"></div>
  <form class="chat-f" id="chat-form">
    <textarea class="field" id="chat-in" rows="2" placeholder="Pergunte qualquer coisa. Ex.: quem eu abordo hoje?" aria-label="Mensagem para a IA"></textarea>
    <button class="btn gold" id="chat-send" type="submit">Enviar</button>
  </form>
</aside>

<div id="camada"></div>
<div id="toasts"></div>

<script>
(() => {
'use strict';

/* ---------- Constantes ---------- */
const ETAPAS = [
  { id: 'novo', nome: 'Na fila' }, { id: 'abordado', nome: 'Abordado' }, { id: 'conversando', nome: 'Em conversa' },
  { id: 'reuniao', nome: 'Reunião marcada' }, { id: 'proposta', nome: 'Proposta enviada' }, { id: 'fechado', nome: 'Fechado' },
  { id: 'descartado', nome: 'Descartado' },
];
const ETAPA = Object.fromEntries(ETAPAS.map(e => [e.id, e.nome]));
const PRESENCA = { sem_site: 'Sem site', so_instagram: 'Só Instagram', so_linktree: 'Só Linktree', site_fraco: 'Site fraco', tem_site: 'Tem site', nao_encontrado: 'Site não encontrado' };
const NICHOS = ['Odontologia', 'Estética', 'Saúde', 'Restaurante', 'Hospedagem', 'Pet', 'Fitness', 'Automotivo', 'Jurídico/Contábil', 'Imobiliária', 'Varejo', 'Beleza', 'Outro'];
const UFS = 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const SERRA_CIDADES = ['Caxias do Sul', 'Bento Gonçalves', 'Gramado', 'Canela', 'Farroupilha', 'Garibaldi', 'Carlos Barbosa', 'Flores da Cunha', 'Nova Petrópolis', 'Veranópolis', 'Nova Prata', 'São Marcos', 'Antônio Prado', 'Vacaria', 'São Francisco de Paula', 'Cambará do Sul', 'Picada Café', 'Pinto Bandeira', 'Monte Belo do Sul', 'Nova Pádua', 'Cotiporã', 'Guaporé', 'Serafina Corrêa', 'Nova Roma do Sul', 'Bom Jesus', 'Ipê', 'Santa Tereza', 'Boa Vista do Sul', 'Fagundes Varela', 'Vila Flores', 'Nova Bassano', 'Paraí', 'Jaquirana', 'São José dos Ausentes', 'Linha Nova', 'Presidente Lucena', 'Morro Reuter', 'Santa Maria do Herval'];
const semAcento = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const SERRA = new Set(SERRA_CIDADES.map(semAcento));
const naSerra = l => l.uf === 'RS' && SERRA.has(semAcento(l.cidade));
const MODO_LOCAL = !(window.claude && typeof window.claude.use === 'function');
const CORTE_N = 72, CORTE_P = 50;
const COLS = [
  { id: 'max', nome: 'Prioridade máxima', dica: 'Precisam muito e têm caixa para pagar', t: l => l.necessidade >= CORTE_N && l.potencial >= CORTE_P },
  { id: 'precisam', nome: 'Mais precisam', dica: 'Presença digital fraca. Confirme o orçamento', t: l => l.necessidade >= CORTE_N && l.potencial < CORTE_P },
  { id: 'compram', nome: 'Tendem a comprar', dica: 'Negócio com movimento. Venda melhoria', t: l => l.necessidade < CORTE_N && l.potencial >= CORTE_P },

}

  const colRef = (path, lim = 1000) => {
    const q = { path, limit: n => colRef(path, n), where: () => q, orderBy: () => q, get: async () => snapCol(path, lim),
      doc: id => docRef(path + '/' + (id || Date.now().toString(36) + Math.random().toString(36).slice(2, 8))),
      add: async d => { const r = q.doc(); await r.set(d); return r; },
      onSnapshot: next => ouvir(() => next(snapCol(path, lim))) };
    return q;
  };
  window.addEventListener('storage', e => { if (e.key === CH) { try { dados = JSON.parse(e.newValue || '{}') || {}; } catch (x) {} avisar(); } });
  if (novo && location.protocol !== 'file:') {
    fetch('dados/leads.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
      if (!j) return;
      for (const x of Array.isArray(j.leads) ? j.leads : []) { if (x && typeof x.id === 'string') { const { id, ...d } = x; if (!dados['leads/' + id]) dados['leads/' + id] = d; } }
      if (j.config && !dados['config/principal']) dados['config/principal'] = j.config;
      salvar(); avisar();
    }).catch(() => {});
  }

  /* IA: chama a API do Claude direto do navegador, com o SDK oficial que vem na pasta vendor/ */
  let sdk = null;
  const carregarSdk = () => sdk || (sdk = import('./vendor/anthropic-sdk.mjs').then(m => m.Anthropic).catch(e => { sdk = null; throw e; }));
  async function erroApi(e, texto) {
    const A = await carregarSdk().catch(() => null);
    const base = texto ? { text: texto } : {};
    if (e && (e.name === 'AbortError' || (A && e instanceof A.APIUserAbortError))) return { code: 'cancelled', ...base };
    const st = e && e.status;
    const msg = String((e && e.error && e.error.error && e.error.error.message) || (e && e.message) || '');
    if (st === 401) return { code: 'chave_invalida', message: msg, ...base };
    if (st === 429) return { code: 'rate_limited', message: msg, ...base };
    if (/credit balance/i.test(msg)) return { code: 'sem_credito', message: msg, ...base };
    if (st) return { code: 'api', message: msg.slice(0, 240), ...base };
    return { code: 'upstream_error', message: msg, ...base };
  }
  // Depois de uma troca de modelo no meio da resposta, o histórico devolve só o que a API aceita antes do bloco "fallback".
  function ecoSeguro(content) {
    const iFb = content.map(b => b.type).lastIndexOf('fallback');
    if (iFb < 0) return content;
    const pares = new Set(content.filter(b => /_tool_result$/.test(b.type) && b.type !== 'tool_result').map(b => b.tool_use_id));
    return content.filter((b, i) => i >= iFb || b.type === 'text' || (/_tool_result$/.test(b.type) && b.type !== 'tool_result') || (b.type === 'server_tool_use' && pares.has(b.id)));
  }
  async function sample(input, opts = {}) {
    const k = mem('radar.apikey');
    if (!k) throw { code: 'sem_chave', message: '' };
    let A;
    try { A = await carregarSdk(); } catch (e) { throw { code: 'api', message: 'não consegui carregar vendor/anthropic-sdk.mjs (abra pelo atalho do Radar)' }; }
    const cli = new A({ apiKey: k, dangerouslyAllowBrowser: true, maxRetries: 2 });
    const msgs = typeof input === 'string' ? [{ role: 'user', content: input }] : input.map(t => ({ role: t.role, content: t.content }));
    const ferr = (opts.tools || []).map(t => ({ name: t.name, description: t.description, input_schema: t.inputSchema || { type: 'object', properties: {} } }));
    const tools = [...(opts.serverTools || []), ...ferr];
    let texto = '', truncated = false;
    for (let volta = 0; volta < 12; volta++) {
      if (opts.signal && opts.signal.aborted) throw { code: 'cancelled', ...(texto ? { text: texto } : {}) };
      const params = { model: 'claude-opus-5-5', max_tokens: opts.maxTokens || 32000, messages: msgs, output_config: { effort: opts.effort || 'medium' },
        betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' };
      if (tools.length) params.tools = tools;
      let sep = texto ? '\n\n' : '';
      let msg;
      try {
        const stream = cli.beta.messages.stream(params, opts.signal ? { signal: opts.signal } : undefined);
        stream.on('text', d => { if (!d) return; texto += sep + d; sep = ''; if (opts.onText) { try { opts.onText({ text: texto, delta: d }); } catch (e) {} } });
        msg = await stream.finalMessage();
      } catch (e) { throw await erroApi(e, texto); }
      if (msg.stop_reason === 'refusal') throw { code: 'refused', message: '' };
      if (msg.stop_reason === 'max_tokens') truncated = true;
      if (msg.stop_reason === 'pause_turn') { msgs.push({ role: 'assistant', content: ecoSeguro(msg.content) }); continue; }
      const usos = msg.content.filter(b => b.type === 'tool_use');
      if (msg.stop_reason === 'tool_use' && usos.length) {
        msgs.push({ role: 'assistant', content: ecoSeguro(msg.content) });
        const sinal = opts.signal || new AbortController().signal;
        const res = await Promise.all(usos.map(async u => {
          const t = (opts.tools || []).find(x => x.name === u.name);
          try {
            if (!t) throw new Error('ferramenta desconhecida');
            const r = await t.execute(u.input || {}, { signal: sinal });
            return { type: 'tool_result', tool_use_id: u.id, content: typeof r === 'string' ? r : JSON.stringify(r ?? null) };
          } catch (e) { return { type: 'tool_result', tool_use_id: u.id, content: 'Error: ' + ((e && e.message) || String(e)), is_error: true }; }
        }));
        msgs.push({ role: 'user', content: res });
        continue;
      }
      break;
    }
    if (!texto.trim()) throw { code: 'empty_completion', message: '' };
    return { text: texto, truncated, modelTierApplied: 'default' };
  }
  sample.json = async (input, opts) => {
    const { text } = await sample(input, opts);
    const t = text.trim(), tentar = s => { try { return { ok: true, v: JSON.parse(s) }; } catch (e) { return { ok: false }; } };
    let r = tentar(t);
    if (!r.ok) { const m = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) r = tentar(m[1].trim()); }
    if (!r.ok) { const i = t.search(/[\[{]/), j = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}')); if (i >= 0 && j > i) r = tentar(t.slice(i, j + 1)); }
    if (!r.ok) throw { code: 'invalid_json', message: '', text };
    return r.v;
  };
  sample.limits = async () => ({ maxPromptBytes: 262144, tools: { maxCount: 16 } });

  const downloads = { save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/.test(filename) ? 'application/json' : 'text/csv;charset=utf-8' });
    const a = el('a', { href: URL.createObjectURL(blob), download: filename }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return { status: 'saved' };
  } };
  return { db: { doc: docRef, collection: colRef }, sample, downloads };
}

/* ---------- Início ---------- */
irPara(location.hash.slice(1));
renderChat();
if (mem('radar.chat') === '1' || (mem('radar.chat') == null && window.innerWidth >= 1280)) abrirChat();
const LOCAL = MODO_LOCAL ? criarLocal() : {};
const usar = n => MODO_LOCAL ? Promise.resolve(LOCAL[n] || null) : window.claude.use(n).catch(() => null);
usar('db').then(initDb);
usar('sample').then(async s => { S.sample = s; if (s) { const lim = await s.limits().catch(() => null); S.tools = !!(lim && lim.tools); } renderChat(); render(); });
usar('mcp').then(m => { S.mcp = m; });
usar('downloads').then(d => { S.dl = d; render(); });
})();
</script>
